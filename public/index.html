<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tandem | 多倫多 LGBTQ+ 華人社群</title>
  <meta name="description" content="Tandem 係一個立足多倫多嘅 LGBTQ+ 廣東話與多元華人社群，定期舉辦桌遊聚會、戶外健行同生活互助交流。" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 flex flex-col min-h-screen selection:bg-rose-500 selection:text-white antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-neutral-950/80 border-b border-neutral-800">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2 group">
        <span class="w-3 h-3 rounded-full bg-gradient-to-r from-rose-500 to-indigo-500 group-hover:scale-125 transition-transform duration-300"></span>
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-neutral-200 to-neutral-400 bg-clip-text text-transparent">
          Tandem.
        </span>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-neutral-400">
        <a href="#about" class="hover:text-white transition">關於我哋</a>
        <a href="#events" class="hover:text-white transition">近期活動</a>
        <a href="#values" class="hover:text-white transition">安全原則</a>
        <a href="#contact" class="hover:text-white transition">聯絡加入</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="/admin/" target="_blank" class="hidden sm:inline-block text-xs font-medium text-neutral-500 hover:text-neutral-300 transition px-2 py-1">
          CMS 登入
        </a>
        <a href="#events" class="rounded-full bg-gradient-to-r from-rose-500 to-purple-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:opacity-95 transition">
          參加活動
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow">
    <!-- Hero Section -->
    <section class="relative overflow-hidden py-24 sm:py-32 border-b border-neutral-900">
      <div class="absolute inset-0 -z-10 flex items-center justify-center pointer-events-none">
        <div class="w-[700px] h-[360px] bg-gradient-to-tr from-rose-600/15 via-purple-600/15 to-indigo-600/15 blur-[140px] rounded-full"></div>
      </div>

      <div class="max-w-4xl mx-auto px-6 text-center">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-neutral-800 bg-neutral-900/80 text-xs text-neutral-300 mb-8 backdrop-blur-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          立足多倫多 · 本地 LGBTQ+ 酷兒互助社群
        </div>

        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-[1.15]">
          同路同行，<br class="hidden sm:inline" />
          <span class="bg-gradient-to-r from-rose-400 via-purple-300 to-indigo-300 bg-clip-text text-transparent">
            喺異鄉搵到屬於你嘅安全角落。
          </span>
        </h1>

        <p class="mt-6 text-base sm:text-lg text-neutral-400 max-w-2xl mx-auto leading-relaxed">
          Tandem 為多倫多嘅酷兒夥伴建立。無論係初到加拿大展開新生活，定係想搵志同道合嘅朋友傾偈、玩 Board Game 或者走入自然，呢度隨時歡迎你。
        </p>

        <div class="mt-10 flex flex-wrap items-center justify-center gap-4">
          <a href="#events" class="rounded-xl bg-white text-neutral-950 px-6 py-3 text-sm font-semibold hover:bg-neutral-200 transition shadow-sm">
            瀏覽近期活動
          </a>
          <a href="#about" class="rounded-xl border border-neutral-800 bg-neutral-900 px-6 py-3 text-sm font-semibold text-neutral-300 hover:bg-neutral-800 transition">
            了解社群理念
          </a>
        </div>
      </div>
    </section>

    <!-- Dynamic Events Section -->
    <section id="events" class="py-20 max-w-6xl mx-auto px-6 border-b border-neutral-900">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-12 gap-4">
        <div>
          <span class="text-xs uppercase tracking-widest text-rose-400 font-bold block mb-1">Upcoming Events</span>
          <h2 class="text-3xl font-extrabold text-white">近期社群聚會</h2>
        </div>
        <p class="text-xs text-neutral-500">
          內容經由 Decap CMS 自動同步
        </p>
      </div>

      <!-- Events Grid -->
      <div id="events-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Default / Skeleton Placeholder while fetching -->
        <div class="p-6 rounded-2xl bg-neutral-900/40 border border-neutral-800 animate-pulse h-64 flex flex-col justify-between">
          <div>
            <div class="h-4 w-20 bg-neutral-800 rounded mb-4"></div>
            <div class="h-6 w-3/4 bg-neutral-800 rounded mb-2"></div>
            <div class="h-4 w-full bg-neutral-800 rounded mb-1"></div>
            <div class="h-4 w-2/3 bg-neutral-800 rounded"></div>
          </div>
          <div class="h-4 w-24 bg-neutral-800 rounded"></div>
        </div>
      </div>
    </section>

    <!-- About Section -->
    <section id="about" class="py-20 max-w-5xl mx-auto px-6 border-b border-neutral-900">
      <div class="grid md:grid-cols-2 gap-12 items-center">
        <div>
          <span class="text-xs uppercase tracking-
