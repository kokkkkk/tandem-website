backend:
  name: github
  repo: kokkkkk/tandem-website
  branch: main
  base_url: https://tandemcanada.org    # Do not include a trailing slash "/"
  auth_endpoint: api/auth

# Media upload storage path
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Define editable content collections for the CMS
collections:
  - name: "site_data"
    label: "Website Content"
    files:
      - name: "events_list"
        label: "Upcoming Events List"
        file: "public/data/events.json"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Date & Time", name: "date", widget: "datetime" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "RSVP Link", name: "rsvp_link", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }