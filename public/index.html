<!-- js-yaml library -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <script>
    async function loadEvents() {
      const container = document.getElementById("events-grid");
      if (!container) return;

      try {
        const res = await fetch("/api/events");
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        
        const data = await res.json();
        console.log("Raw API response:", data);

        if (!data.events || data.events.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-12 text-center text-neutral-500 text-sm border border-dashed border-neutral-800 rounded-2xl">
              目前暫無新活動公佈，請留意後續更新！
            </div>
          `;
          return;
        }

        const parsedEvents = [];

        for (const item of data.events) {
          try {
            const raw = item.content.trim();
            // Handle both \r\n and \n line endings
            if (!raw.startsWith("---")) continue;

            const secondDashesIndex = raw.indexOf("---", 3);
            if (secondDashesIndex === -1) continue;

            const yamlText = raw.slice(3, secondDashesIndex).trim();
            const bodyText = raw.slice(secondDashesIndex + 3).trim();

            const parsed = jsyaml.load(yamlText) || {};
            parsed.body = parsed.body || bodyText;
            parsedEvents.push(parsed);
          } catch (e) {
            console.warn("Failed to parse event:", item.name, e);
          }
        }

        if (parsedEvents.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-12 text-center text-neutral-500 text-sm border border-dashed border-neutral-800 rounded-2xl">
              目前暫無新活動公佈，請留意後續更新！
            </div>
          `;
          return;
        }

        // Sort descending by date
        parsedEvents.sort((a, b) => {
          const dateA = a.date ? new Date(a.date).getTime() : 0;
          const dateB = b.date ? new Date(b.date).getTime() : 0;
          return dateB - dateA;
        });

        // Format dates cleanly for display
        function formatDisplayDate(dateStr) {
          if (!dateStr) return "";
          try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr.replace("T", " ");
            return d.toLocaleDateString("zh-HK", {
              year: "numeric",
              month: "short",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            });
          } catch (_) {
            return dateStr;
          }
        }

        container.innerHTML = parsedEvents.map(evt => `
          <div class="p-6 rounded-2xl bg-neutral-900/60 border border-neutral-800 flex flex-col justify-between hover:border-neutral-700 transition">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="inline-block px-2.5 py-0.5 rounded text-xs font-semibold bg-rose-500/10 text-rose-300 border border-rose-500/20">
                  ${evt.category || "社群活動"}
                </span>
                <span class="text-xs text-neutral-400">
                  ${formatDisplayDate(evt.date)}
                </span>
              </div>
              <h3 class="text-lg font-bold text-white mb-2">${evt.title || "未命名活動"}</h3>
              <p class="text-xs text-neutral-400 leading-relaxed line-clamp-3 mb-4">
                ${evt.body || ""}
              </p>
              ${evt.location ? `
                <div class="flex items-center gap-1.5 text-xs text-neutral-400 mb-2">
                  <svg class="w-3.5 h-3.5 text-neutral-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                  <span>${evt.location}</span>
                </div>
              ` : ''}
            </div>

            <div class="pt-4 mt-2 border-t border-neutral-800/60 flex items-center justify-between">
              ${evt.rsvp_link ? `
                <a href="${evt.rsvp_link}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-rose-400 hover:text-rose-300 flex items-center gap-1">
                  立即報名 / RSVP &rarr;
                </a>
              ` : `
                <span class="text-xs text-neutral-500">自由出席 / 無需報名</span>
              `}
            </div>
          </div>
        `).join("");

      } catch (err) {
        console.error("Failed to render events:", err);
        container.innerHTML = `
          <div class="col-span-full py-8 text-center text-xs text-neutral-500">
            載入活動資料失敗，請稍後重新整理頁面。
          </div>
        `;
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loadEvents);
    } else {
      loadEvents();
    }
  </script>
